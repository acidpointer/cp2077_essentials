name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish essentials
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc(\.[0-9]+)?)?$ ]]; then
            echo 'Use vX.Y.Z, vX.Y.Z-rc or vX.Y.Z-rc.N.' >&2
            exit 1
          fi

      - name: Install Linux build tools
        run: |
          pacman -Syu --noconfirm --needed \
            ca-certificates cmake clang lld llvm git python curl tar \
            coreutils ninja github-cli compiler-rt
          clang-cl --version
          cmake --version

      - name: Checkout official upstream submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Trust container workspace repositories
        run: |
          # Checkout uses temporary Git config; later shell steps use container HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/*"

      - name: Audit source layout
        run: python3 scripts/check-sources.py

      - name: Test patch and release tooling
        run: python3 -m unittest discover -s tests -v

      - name: Build all seven Release packages
        run: ./build-linux.sh --config Release --jobs 2

      - name: Test patched Input Loader XML behavior
        env:
          CP2077_REQUIRE_INPUT_TESTS: '1'
        run: python3 -m unittest discover -s tests -p test_input_loader.py -v

      - name: Test CET runtime helpers
        env:
          CP2077_REQUIRE_CET_TESTS: '1'
        run: |
          python3 -m unittest discover -s tests -p test_cet_runtime.py -v
          python3 scripts/test-cet-runtime.py

      - name: Prepare sixteen verified release archives
        run: |
          python3 scripts/check-sources.py
          python3 scripts/release.py "$GITHUB_REF_NAME"
          cd build/github-release
          sha256sum --check SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publishing.py "$GITHUB_REF_NAME"

      - name: Retain prepared packages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            build/github-release/*.zip
            build/github-release/*.sha256
            build/github-release/SHA256SUMS
            build/github-release/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
